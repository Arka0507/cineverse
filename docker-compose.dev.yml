# Standalone development configuration; do not merge with production compose.
name: cineverse-dev
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    env_file: .env
    environment:
      ENVIRONMENT: development
      DEMO_PROFILES: "true"
      ARTIFACTS_DIR: /app/artifacts
      DATABASE_PATH: /app/runtime/cineverse.db
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes: ["./backend:/app/backend", "./ml_engine:/app/ml_engine", "./artifacts:/app/artifacts", "cineverse_dev_runtime:/app/runtime"]
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes: ["./frontend:/app", "cineverse_node_modules:/app/node_modules", "cineverse_next:/app/.next"]
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  cineverse_dev_runtime:
  cineverse_node_modules:
  cineverse_next:
